name: Main Branch Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    name: Deploy to Dev (Automatic)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          cd drawio-jira-confluence/backend
          pip install -r requirements.txt
      
      - name: Validate application
        run: |
          echo "Validating application..."
          # Check if Python files have syntax errors
          python -m py_compile drawio-jira-confluence/backend/app.py
          echo "✓ Python syntax validation passed"
          
          # Add your test commands here when tests are available
          # Example: cd drawio-jira-confluence/backend && pytest tests/
      
      - name: Deploy to Dev Environment
        run: |
          echo "Deploying to Dev environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add your deployment commands here
          # Example: scp, rsync, docker push, etc.
      
      - name: Deployment Summary
        run: |
          echo "✅ Successfully deployed to Dev environment"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  deploy-qa:
    name: Deploy to QA (Manual)
    runs-on: ubuntu-latest
    needs: deploy-dev
    permissions:
      contents: read
    environment:
      name: qa
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          cd drawio-jira-confluence/backend
          pip install -r requirements.txt
      
      - name: Deploy to QA Environment
        run: |
          echo "Deploying to QA environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add your deployment commands here
          # Example: scp, rsync, docker push, etc.
      
      - name: Deployment Summary
        run: |
          echo "✅ Successfully deployed to QA environment"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  deploy-prod:
    name: Deploy to Prod (Manual)
    runs-on: ubuntu-latest
    needs: deploy-qa
    permissions:
      contents: read
    environment:
      name: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          cd drawio-jira-confluence/backend
          pip install -r requirements.txt
      
      - name: Deploy to Prod Environment
        run: |
          echo "Deploying to Production environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Add your deployment commands here
          # Example: scp, rsync, docker push, etc.
      
      - name: Deployment Summary
        run: |
          echo "✅ Successfully deployed to Production environment"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
